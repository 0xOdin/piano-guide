<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta name="theme-color" content="#fafaf9">
    <link rel="canonical" href="{{canonical}}">
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <script>
        document.documentElement.classList.add("js");
        // light or dark, before anything is drawn: the one picked with the toggle in the header, or else the device's
        // setting (main.js keeps it in step)
        (function () {
            var picked = null;
            try { picked = localStorage.getItem("pianoguide-theme"); } catch (e) {}
            var dark = picked ? picked === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = dark ? "dark" : "light";
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
{{styles}}
</head>

<body>
    <header>
        <a href="/" class="logo"><svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#1C1917"/><rect x="4" y="4.6" width="16" height="1.8" rx=".5" fill="#B3302D"/><rect x="4" y="7.4" width="16" height="12.6" rx="1.5" fill="#FAFAF9"/><path d="M9.33 7.4v12.6M14.67 7.4v12.6" stroke="#1C1917" stroke-width=".9"/><rect x="7.6" y="7.4" width="3.4" height="7.4" rx=".6" fill="#1C1917"/><rect x="12.9" y="7.4" width="3.4" height="7.4" rx=".6" fill="#1C1917"/></svg><span>PianoGuide</span></a>

        <nav class="header-links" aria-label="Main navigation">
            <ul>
{{nav}}
            </ul>
        </nav>

        <div class="header-btn-container">
            <form class="search-form" role="search" action="/search/">
                <label class="sr-only" for="site-search">Search</label>
                <input id="site-search" type="search" name="q" placeholder="Search">
            </form>
            <button class="theme-btn" type="button" aria-label="Dark mode" aria-pressed="false">
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
            </button>
            <button class="search-btn" type="button" aria-label="Search"><img src="/assets/icons/search.svg" alt=""></button>
            <button class="menu-btn" type="button" aria-label="Menu"><img src="/assets/icons/menu.svg" alt=""></button>
        </div>
    </header>

    <main>
{{content}}
    </main>

    <footer>
        <div class="footer-top">
            <div class="footer-brand">
                <a href="/" class="logo"><svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#1C1917"/><rect x="4" y="4.6" width="16" height="1.8" rx=".5" fill="#B3302D"/><rect x="4" y="7.4" width="16" height="12.6" rx="1.5" fill="#FAFAF9"/><path d="M9.33 7.4v12.6M14.67 7.4v12.6" stroke="#1C1917" stroke-width=".9"/><rect x="7.6" y="7.4" width="3.4" height="7.4" rx=".6" fill="#1C1917"/><rect x="12.9" y="7.4" width="3.4" height="7.4" rx=".6" fill="#1C1917"/></svg><span>PianoGuide</span></a>
                <p>Scales, chords and arpeggios in every key, and a place to practise them.</p>
            </div>
            <nav aria-label="Footer navigation">
                <ul>
{{footerNav}}
                <li><a href="/keyboard/">Keyboard</a></li>
                </ul>
            </nav>
        </div>
        <div class="footer-bottom">
            <p>&copy; {{year}} PianoGuide</p>
            <p>Piano sound: recordings of a Steinway by the University of Iowa Electronic Music Studios</p>
        </div>
    </footer>

{{scripts}}
</body>

</html>
