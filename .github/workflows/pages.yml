# Builds the site and publishes it on GitHub Pages every time main is pushed.
# On GitHub, the repository's Settings → Pages → Source must be "GitHub Actions".
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button on the Actions tab, to publish again by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }} # https://0xodin.github.io/piano-guide: canonical links, sitemap
          BASE_PATH: ${{ steps.pages.outputs.base_path }} # /piano-guide: in front of every link on the site
      - run: npm run check # the fingerings, notes and key signatures agree everywhere, or nothing is published
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
